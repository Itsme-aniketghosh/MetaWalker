[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metawalker"
version = "0.2.7"
description = "Learned black-box optimizers (RL-controlled CMA-ES, learned walkers) as a drop-in for GridSearchCV"
readme = "docs/package.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "cma>=3.3", "scipy>=1.10"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
optuna = ["optuna>=3.0"]
test = ["pytest", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metawalker = ["policies/*.npy"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
